# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

# ─────────────────────────────────────────────
# Database
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triggerx}
spring.datasource.username=${DB_USERNAME:triggerx}
spring.datasource.password=${DB_PASSWORD:triggerx}

# Flyway owns all DDL — skip Hibernate schema validation at startup
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─────────────────────────────────────────────
# HikariCP — reduce pool size for low-traffic service
# ─────────────────────────────────────────────
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ─────────────────────────────────────────────
# Flyway
# ─────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.aop.proxy-target-class=true

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiry.seconds=2592000

# ─────────────────────────────────────────────
# Email (Gmail SMTP)
# ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder@gmail.com}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─────────────────────────────────────────────
# OTP
# ─────────────────────────────────────────────
otp.expiry.minutes=10
otp.max.attempts=5
otp.rate.limit.per.hour=10

# ─────────────────────────────────────────────
# Alert Limits
# ─────────────────────────────────────────────
alert.max.per.user=50

# ─────────────────────────────────────────────
# CORS
# ─────────────────────────────────────────────
frontend.url=${FRONTEND_URL:https://www.triggerx.in}

# ─────────────────────────────────────────────
# Telegram Bot 
# ─────────────────────────────────────────────
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:TriggerX_AlertBot}
telegram.webhook.url=${TELEGRAM_WEBHOOK_URL:}
# Shared secret Telegram echoes back in the X-Telegram-Bot-Api-Secret-Token
# header on every webhook call. Leave blank to disable the check (dev only).
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}
# ─────────────────────────────────────────────
# Spring AI — Groq via OpenAI-compatible endpoint
# ─────────────────────────────────────────────
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.0
