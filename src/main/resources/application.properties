# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

# ─────────────────────────────────────────────
# Database
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triggerx}
spring.datasource.username=${DB_USERNAME:triggerx}
spring.datasource.password=${DB_PASSWORD:triggerx}

# Flyway owns all DDL — skip Hibernate schema validation at startup
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─────────────────────────────────────────────
# HikariCP — reduce pool size for low-traffic service
# ─────────────────────────────────────────────
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ─────────────────────────────────────────────
# Flyway
# ─────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.aop.proxy-target-class=true

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiry.seconds=2592000

# ─────────────────────────────────────────────
# Email (Gmail SMTP)
# ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder@gmail.com}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─────────────────────────────────────────────
# OTP
# ─────────────────────────────────────────────
otp.expiry.minutes=10
otp.max.attempts=5
otp.rate.limit.per.hour=10

# ─────────────────────────────────────────────
# Alert Limits
# ─────────────────────────────────────────────
alert.max.per.user=50

# ─────────────────────────────────────────────
# CORS
# ─────────────────────────────────────────────
frontend.url=${FRONTEND_URL:https://www.triggerx.in}

# ─────────────────────────────────────────────
# Telegram Bot 
# ─────────────────────────────────────────────
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:TriggerX_AlertBot}
telegram.webhook.url=${TELEGRAM_WEBHOOK_URL:}
# Shared secret Telegram echoes back in the X-Telegram-Bot-Api-Secret-Token
# header on every webhook call. Leave blank to disable the check (dev only).
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}
# ─────────────────────────────────────────────
# Spring AI: Google Gemini via its OpenAI-compatible endpoint
#
# Moved off Groq on 2026-08-20: llama-3.1-8b-instant was shut down (2026-08-16)
# and Groq's free tier caps at 8K tokens/min, about 7 calls, which we hit
# during testing. Gemini's free tier is 250K-1M tokens/min and 1.5K requests/day.
#
# gemini-3.5-flash-lite was chosen by benchmark against our own system prompt:
#   gemini-3.5-flash-lite  9-10/10  ~0.96s   <- chosen
#   gemini-flash-lite-latest  9/10  ~1.07s   (moving alias, so not pinned to)
#   gemini-3.1-flash-lite     8/10  ~7.99s   (too slow for the Telegram loop)
#   gemini-3.7-flash          n/a           (429s on the free tier)
#   gemini-2.5-flash-lite     n/a           (404 - closed to new projects)
#
# PRODUCTION NOTE: set GEMINI_API_KEY in the deploy environment. The old
# GROQ_API_KEY is no longer read, so the AI features stay disabled until it is set.
#
# To go back to Groq, override all three:
#   AI_BASE_URL=https://api.groq.com/openai
#   AI_MODEL=openai/gpt-oss-20b
#   GEMINI_API_KEY=<your groq key>
# ─────────────────────────────────────────────
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.chat.options.temperature=0.0
